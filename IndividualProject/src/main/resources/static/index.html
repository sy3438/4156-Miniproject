<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>State Tax Comparison</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="container">
    <h1>State Tax Comparison</h1>
    <p>Compare the tax on an item between two states.</p>

    <label for="price">Price</label>
    <input type="number" id="price" value="1000">

    <label for="category">Category</label>
    <select id="category">
        <option value="groceries">Groceries</option>
        <option value="clothing">Clothing</option>
        <option value="medicine">Medicine</option>
        <option value="digital goods" selected>Digital Goods</option>
        <option value="cars">Cars</option>
    </select>

    <label for="state1">First State</label>
    <select id="state1">
        <option value="CA">California</option>
        <option value="NY">New York</option>
        <option value="TX">Texas</option>
        <option value="FL">Florida</option>
    </select>

    <label for="state2">Second State</label>
    <select id="state2">
        <option value="NY">New York</option>
        <option value="CA">California</option>
        <option value="TX">Texas</option>
        <option value="FL">Florida</option>
    </select>

    <button id="compareButton">Compare Taxes</button>

    <div id="results"></div>
</div>

<script src="app.js"></script>
</body>
</html>
